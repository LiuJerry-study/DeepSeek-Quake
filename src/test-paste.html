<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek PASTE-TEST[empty]</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f2a; }
  textarea {
    position: absolute; left: 4%; top: 4%; width: 92%; height: 92%;
    font-size: 26px; padding: 12px; box-sizing: border-box;
    background: #101522; color: #e8ecf5; border: 2px solid #4d6bfe;
  }
</style>
</head>
<body>
<textarea id="t" placeholder="在这里点右键试试"></textarea>
<script>
  // 把 textarea 内容实时写进标题，方便从外面读取验证结果
  const t = document.getElementById('t');
  setInterval(() => { document.title = 'DeepSeek PASTE-TEST[' + t.value + ']'; }, 200);
</script>
</body>
</html>
